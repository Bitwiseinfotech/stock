prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_orders,read_customers,read_inventory,read_locations,read_orders,read_payment_customizations,write_discounts,write_inventory,write_metaobject_definitions,write_metaobjects,write_payment_customizations,write_products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[webhooks]
